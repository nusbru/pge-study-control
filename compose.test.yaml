services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pge_identity_test
      POSTGRES_USER: pge
      POSTGRES_PASSWORD: pge_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pge -d pge_identity_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__Database: Host=db-test;Database=pge_identity_test;Username=pge;Password=pge_test_only;GSS Encryption Mode=Disable
    depends_on:
      db-test:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__Database: Host=db-test;Database=pge_identity_test;Username=pge;Password=pge_test_only;GSS Encryption Mode=Disable
    ports:
      - "127.0.0.1:${TEST_API_PORT:-0}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
