services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pge_test
      POSTGRES_USER: pge
      POSTGRES_PASSWORD: pge_test_only
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pge -d pge_test"]
      interval: 2s
      timeout: 3s
      retries: 20
