services:
  db-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pge_local
      POSTGRES_USER: pge
      POSTGRES_PASSWORD: pge_local_only
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pge -d pge_local"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_dev_data:
