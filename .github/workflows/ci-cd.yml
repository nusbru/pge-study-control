name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  backend-tests:
    name: Backend tests
    uses: ./.github/workflows/backend-tests.yml

  api-contract:
    name: API contract
    uses: ./.github/workflows/api-contract.yml

  frontend-checks:
    name: Frontend checks
    uses: ./.github/workflows/frontend-checks.yml

  automated-tests:
    name: Unit, operations, and security tests
    uses: ./.github/workflows/automated-tests.yml

  e2e-tests:
    name: End-to-end tests
    uses: ./.github/workflows/e2e-tests.yml

  production-containers:
    name: Production containers
    uses: ./.github/workflows/production-containers.yml

  local-containers:
    name: Local containers
    uses: ./.github/workflows/local-containers.yml

  image-version:
    name: Shared image version
    needs:
      - backend-tests
      - api-contract
      - frontend-checks
      - automated-tests
      - e2e-tests
      - production-containers
      - local-containers
    uses: ./.github/workflows/image-version.yml

  docker:
    name: Build and publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-version
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_version: ${{ needs.image-version.outputs.image_version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
